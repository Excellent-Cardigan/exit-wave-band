title: Dispatch
icon: text

tabs:
  content:
    label: Content
    fields:
      title:
        label: Title
        type: text
        required: true

      date:
        label: Date
        type: date
        default: today
        required: true

      author:
        label: Author
        type: text
        default: exit.wave
        help: "Use circle name for member-authored posts (e.g. PURITY)"

      transmission_id:
        label: Transmission ID
        type: text
        help: "Lore identifier — e.g. TX-001"
        placeholder: TX-001

      excerpt:
        label: Excerpt
        type: textarea
        size: medium
        help: Short summary shown on the dispatches listing page

      body:
        label: Body
        type: textarea
        size: large
        help: Full text — paragraphs separated by blank lines

  cover:
    label: Cover Image
    sections:
      cover_files:
        type: files
        template: cover
        label: Cover Image
        max: 1
        layout: cards
