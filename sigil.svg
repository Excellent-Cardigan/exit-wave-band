/ Glowing sigil / logo mark
function Sigil({ size = 80 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" stroke="rgba(90,200,180,0.3)" strokeWidth="0.5" />
      <circle cx="50" cy="50" r="28" stroke="rgba(90,200,180,0.2)" strokeWidth="0.5" />
      <circle cx="50" cy="50" r="3" fill="rgba(90,200,180,0.6)" />
      <line x1="50" y1="10" x2="50" y2="90" stroke="rgba(90,200,180,0.15)" strokeWidth="0.5" />
      <line x1="10" y1="50" x2="90" y2="50" stroke="rgba(90,200,180,0.15)" strokeWidth="0.5" />
      <line x1="21" y1="21" x2="79" y2="79" stroke="rgba(90,200,180,0.1)" strokeWidth="0.5" />
      <line x1="79" y1="21" x2="21" y2="79" stroke="rgba(90,200,180,0.1)" strokeWidth="0.5" />
      {/* Diamond shape */}
      <path d="M50 15 L80 50 L50 85 L20 50 Z" stroke="rgba(90,200,180,0.25)" strokeWidth="0.5" fill="none" />
      {/* Inner diamond */}
      <path d="M50 30 L65 50 L50 70 L35 50 Z" stroke="rgba(90,200,180,0.2)" strokeWidth="0.5" fill="none" />
    </svg>
  );
}